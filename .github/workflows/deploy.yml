name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RESEND_KEY: ${{ secrets.RESEND_API_KEY || secrets.RESEND_KEY || secrets.RESEND }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure Turnstile widget
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/challenges/widgets"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          sitekey=$(curl -s "${auth[@]}" "$API?per_page=50" | jq -r '[.result[]? | select(.name=="KTS website contact form")][0].sitekey // empty')
          if [ -z "$sitekey" ]; then
            resp=$(curl -s "${auth[@]}" -X POST "$API" -d '{"name":"KTS website contact form","mode":"managed","domains":["kickstarttechsolutions.com","www.kickstarttechsolutions.com","staging.kickstarttechsolutions.com","kts-website-staging-e56.pages.dev"]}')
            echo "$resp" | jq -e '.success' >/dev/null || { echo "$resp" | jq '{success, errors}'; exit 1; }
            sitekey=$(echo "$resp" | jq -r '.result.sitekey')
            echo "Created Turnstile widget"
          fi
          secret=$(curl -s "${auth[@]}" "$API/$sitekey" | jq -r '.result.secret // empty')
          [ -n "$secret" ] || { echo "Could not read Turnstile secret"; exit 1; }
          echo "::add-mask::$secret"
          echo "TURNSTILE_SITEKEY=$sitekey" >> "$GITHUB_ENV"
          echo "TURNSTILE_SECRET=$secret" >> "$GITHUB_ENV"
          echo "Turnstile site key: $sitekey"

      - name: Build site
        run: python3 build.py

      - name: Store Turnstile secret as a Pages secret
        run: printf %s "$TURNSTILE_SECRET" | npx --yes wrangler@3 pages secret put TURNSTILE_SECRET_KEY --project-name=kts-website-staging

      - name: Check Resend key and sending domain
        run: |
          if [ -z "$RESEND_KEY" ]; then echo "::error::No Resend secret found (expected RESEND_API_KEY)"; exit 1; fi
          curl -s -H "Authorization: Bearer $RESEND_KEY" https://api.resend.com/domains \
            | jq '{domains: [.data[]? | {name, status, region}], error: .message}'

      - name: Store Resend key as a Pages secret
        run: printf %s "$RESEND_KEY" | npx --yes wrangler@3 pages secret put RESEND_API_KEY --project-name=kts-website-staging

      - name: Deploy site and form function
        run: npx --yes wrangler@3 pages deploy dist --project-name=kts-website-staging --branch=main --commit-dirty=true

      - name: Check that the live form loads Turnstile and rejects tokenless posts
        run: |
          sleep 20
          curl -sL https://kickstarttechsolutions.com/contact | grep -q "data-sitekey=\"$TURNSTILE_SITEKEY\"" && echo "Widget present on contact page" || { echo "Widget missing on contact page"; exit 1; }
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://kickstarttechsolutions.com/api/contact -H 'Content-Type: application/json' -d '{"name":"x","company":"x","email":"x@example.com"}')
          echo "Tokenless submission returned HTTP $code (expect 403)"
          [ "$code" = "403" ]
