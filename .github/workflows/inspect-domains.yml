name: Inspect domains (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZONE_ID: 0a4a9e9a9e373ce2a9f7e9a3e97002f1
    steps:
      - name: Read Cloudflare state (no changes)
        run: |
          api() { curl -s -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }
          echo "== token permissions check"
          api "/accounts/$CF_ACCOUNT/tokens/verify" | jq '{success, status: .result.status}'
          api "/user/tokens/verify" | jq '{success, status: .result.status}'
          echo "== zone"
          api "/zones/$ZONE_ID" | jq '{success, name: .result.name, status: .result.status, errors}'
          echo "== DNS records for apex and www"
          api "/zones/$ZONE_ID/dns_records?per_page=100" | jq '{success, errors, records: [.result[]? | {name, type, content, proxied}]}'
          echo "== Pages project domains"
          api "/accounts/$CF_ACCOUNT/pages/projects/kts-website-staging/domains" | jq '{success, errors, domains: [.result[]? | {name, status}]}'
          echo "== Access apps (names and domains only)"
          api "/accounts/$CF_ACCOUNT/access/apps" | jq '{success, errors, apps: [.result[]? | {name, domain, self_hosted_domains}]}'
          echo "== live responses"
          for h in kickstarttechsolutions.com www.kickstarttechsolutions.com; do echo "-- $h"; curl -sI "https://$h" | grep -iE '^(HTTP|location|server)' || echo "no response"; done
